[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
caravel-db = { path = "crates/db" }
caravel-adapters = { path = "crates/adapters" }
caravel-core = { path = "crates/core" }
caravel-api = { path = "crates/api" }
caravel-relay = { path = "crates/relay" }

aes = "0.8"
anyhow = "1.0"
bytes = "1"
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
coracle-kinds = "0.1.0"
coracle-lib = "0.1.0"
dotenvy = "0.15.7"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
object_store = { version = "0.12", features = ["aws"] }
rand = "0.8"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json"] }
thiserror = "2"
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1"
uuid = { version = "1.7", features = ["v4"] }
